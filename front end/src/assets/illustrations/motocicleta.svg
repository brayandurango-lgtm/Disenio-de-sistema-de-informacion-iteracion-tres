<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" fill="none" role="img" aria-label="Ilustración Motocicleta Cyber">
  <defs>
    <linearGradient id="motoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b3b52" />
      <stop offset="50%" stop-color="#1e1e2d" />
      <stop offset="100%" stop-color="#0f0f18" />
    </linearGradient>
    <linearGradient id="motoViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <filter id="motoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ground Cyber Grid Line -->
  <line x1="20" y1="260" x2="480" y2="260" stroke="#222230" stroke-width="2" />
  <line x1="60" y1="260" x2="440" y2="260" stroke="#A855F7" stroke-width="2" opacity="0.4" filter="url(#motoGlow)" />

  <!-- Shadow -->
  <ellipse cx="250" cy="256" rx="160" ry="10" fill="#A855F7" opacity="0.2" filter="url(#motoGlow)" />
  <ellipse cx="250" cy="256" rx="140" ry="6" fill="#000000" opacity="0.7" />

  <!-- Rear Wheel (Left) -->
  <circle cx="120" cy="225" r="46" fill="#09090F" stroke="#222230" stroke-width="5" />
  <circle cx="120" cy="225" r="30" fill="#161621" stroke="#A855F7" stroke-width="2.5" />
  <circle cx="120" cy="225" r="12" fill="#FF4057" filter="url(#motoGlow)" />
  <line x1="120" y1="197" x2="120" y2="253" stroke="#A855F7" stroke-width="2" />
  <line x1="92" y1="225" x2="148" y2="225" stroke="#A855F7" stroke-width="2" />

  <!-- Front Wheel (Right) -->
  <circle cx="380" cy="225" r="46" fill="#09090F" stroke="#222230" stroke-width="5" />
  <circle cx="380" cy="225" r="30" fill="#161621" stroke="#A855F7" stroke-width="2.5" />
  <circle cx="380" cy="225" r="12" fill="#FF4057" filter="url(#motoGlow)" />
  <line x1="380" y1="197" x2="380" y2="253" stroke="#A855F7" stroke-width="2" />
  <line x1="352" y1="225" x2="408" y2="225" stroke="#A855F7" stroke-width="2" />

  <!-- Swingarm & Chain Drive -->
  <polygon points="120,225 210,195 240,230 150,235" fill="#1a1a26" stroke="#38384f" stroke-width="1.5" />
  <line x1="120" y1="225" x2="220" y2="215" stroke="#FF4057" stroke-width="2" />

  <!-- Engine Core / Battery Cell -->
  <rect x="200" y="170" width="70" height="55" rx="8" fill="#12121d" stroke="#A855F7" stroke-width="2" />
  <line x1="210" y1="185" x2="260" y2="185" stroke="#FF4057" stroke-width="2" />
  <line x1="210" y1="198" x2="260" y2="198" stroke="#A855F7" stroke-width="2" />
  <line x1="210" y1="210" x2="260" y2="210" stroke="#FF4057" stroke-width="2" />

  <!-- Frame & Tank Assembly -->
  <path d="M 120 225 
           L 180 150 
           L 260 145 
           L 320 120 
           L 360 140 
           L 380 225" 
        stroke="#A855F7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Cyber Tank Shell -->
  <path d="M 220 145 
           C 250 120, 290 115, 335 130 
           L 320 165 
           L 210 165 
           Z" 
        fill="url(#motoGrad)" stroke="#FF4057" stroke-width="2" />

  <!-- Seat (Solo Cyber Saddle) -->
  <path d="M 160 155 
           C 180 145, 210 145, 230 160 
           L 210 170 
           L 155 165 
           Z" 
        fill="#09090F" stroke="#A855F7" stroke-width="2" />

  <!-- Handlebars & Front Cyber Fork -->
  <line x1="335" y1="120" x2="380" y2="225" stroke="#3b3b52" stroke-width="5" stroke-linecap="round" />
  <line x1="330" y1="125" x2="375" y2="220" stroke="#A855F7" stroke-width="2" filter="url(#motoGlow)" />
  <path d="M 315 110 L 338 122 L 325 132" stroke="#F4F4F5" stroke-width="3" stroke-linecap="round" />

  <!-- Headlight & Fairing -->
  <polygon points="340,120 375,135 365,155 330,135" fill="url(#motoGrad)" stroke="#38384f" stroke-width="1.5" />
  <polygon points="368,135 385,142 375,150" fill="#A855F7" filter="url(#motoGlow)" />
  <line x1="385" y1="142" x2="420" y2="148" stroke="#C084FC" stroke-width="2.5" filter="url(#motoGlow)" />

  <!-- Tail Light -->
  <line x1="145" y1="160" x2="160" y2="155" stroke="#FF4057" stroke-width="4" stroke-linecap="round" filter="url(#motoGlow)" />
</svg>
