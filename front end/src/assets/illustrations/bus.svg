<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 340" fill="none" role="img" aria-label="Ilustración Bus Cyber">
  <defs>
    <linearGradient id="busBody" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#242436" />
      <stop offset="50%" stop-color="#161623" />
      <stop offset="100%" stop-color="#0f0f18" />
    </linearGradient>
    <linearGradient id="busViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <filter id="busGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ground Grid Line -->
  <line x1="20" y1="285" x2="630" y2="285" stroke="#222230" stroke-width="2" />
  <line x1="50" y1="285" x2="600" y2="285" stroke="#A855F7" stroke-width="2" opacity="0.4" filter="url(#busGlow)" />

  <!-- Shadow & Underglow -->
  <ellipse cx="325" cy="280" rx="270" ry="12" fill="#A855F7" opacity="0.25" filter="url(#busGlow)" />
  <ellipse cx="325" cy="280" rx="250" ry="8" fill="#000000" opacity="0.75" />

  <!-- Aerodynamic Roof Fairing & AC Units -->
  <rect x="220" y="65" width="160" height="15" rx="5" fill="#38384f" stroke="#A855F7" stroke-width="1.5" />
  <line x1="240" y1="72" x2="360" y2="72" stroke="#FF4057" stroke-width="2" />

  <!-- Bus Main Body Monocoque -->
  <path d="M 60 255 
           L 55 105 
           Q 55 75, 85 75 
           L 550 75 
           Q 595 78, 600 135 
           L 600 240 
           L 580 255 
           L 540 255 
           A 44 44 0 0 0 450 255 
           L 240 255 
           A 44 44 0 0 0 150 255 
           Z" 
        fill="url(#busBody)" stroke="#38384f" stroke-width="2" />

  <!-- Cyber LED Route Display (Destination Board) -->
  <rect x="500" y="88" width="85" height="18" rx="3" fill="#09090F" stroke="#A855F7" stroke-width="1.5" />
  <text x="505" y="101" fill="#C084FC" font-family="monospace" font-size="10" font-weight="bold" filter="url(#busGlow)">AUTOS COL</text>

  <!-- Panoramic Windows Strip -->
  <rect x="80" y="115" width="410" height="55" rx="4" fill="#0c0c14" stroke="#A855F7" stroke-width="1.5" />
  <!-- Window Dividers -->
  <line x1="150" y1="115" x2="150" y2="170" stroke="#222230" stroke-width="2" />
  <line x1="220" y1="115" x2="220" y2="170" stroke="#222230" stroke-width="2" />
  <line x1="290" y1="115" x2="290" y2="170" stroke="#222230" stroke-width="2" />
  <line x1="360" y1="115" x2="360" y2="170" stroke="#222230" stroke-width="2" />
  <line x1="430" y1="115" x2="430" y2="170" stroke="#222230" stroke-width="2" />

  <!-- Windshield (Front Giant Panoramic Glass) -->
  <path d="M 505 115 L 585 125 L 585 185 L 505 180 Z" fill="#0c0c14" stroke="#A855F7" stroke-width="1.5" />

  <!-- Neon Accent Lines -->
  <line x1="60" y1="185" x2="595" y2="195" stroke="url(#busViolet)" stroke-width="3" filter="url(#busGlow)" />
  <line x1="60" y1="215" x2="585" y2="225" stroke="#FF4057" stroke-width="2" />

  <!-- Passenger Doors (Double Sliding Cyber Doors) -->
  <rect x="375" y="172" width="50" height="80" fill="none" stroke="#A855F7" stroke-width="1.5" />
  <line x1="400" y1="172" x2="400" y2="252" stroke="#A855F7" stroke-width="1.5" />
  <rect x="380" y="180" width="16" height="40" fill="#09090F" stroke="#38384f" stroke-width="1" />
  <rect x="404" y="180" width="16" height="40" fill="#09090F" stroke="#38384f" stroke-width="1" />

  <!-- Headlights & Front Cyber Bumper -->
  <rect x="585" y="215" width="15" height="20" rx="3" fill="#A855F7" filter="url(#busGlow)" />
  <line x1="600" y1="225" x2="635" y2="227" stroke="#C084FC" stroke-width="3" filter="url(#busGlow)" />
  <line x1="565" y1="240" x2="595" y2="242" stroke="#FF4057" stroke-width="3" />

  <!-- Rear Lights -->
  <rect x="50" y="195" width="8" height="45" rx="3" fill="#FF4057" filter="url(#busGlow)" />

  <!-- Rear Wheel (Dual Axle Style) -->
  <circle cx="195" cy="255" r="40" fill="#09090F" stroke="#222230" stroke-width="4" />
  <circle cx="195" cy="255" r="26" fill="#161621" stroke="#A855F7" stroke-width="2" />
  <circle cx="195" cy="255" r="10" fill="#FF4057" filter="url(#busGlow)" />

  <!-- Front Wheel -->
  <circle cx="495" cy="255" r="40" fill="#09090F" stroke="#222230" stroke-width="4" />
  <circle cx="495" cy="255" r="26" fill="#161621" stroke="#A855F7" stroke-width="2" />
  <circle cx="495" cy="255" r="10" fill="#FF4057" filter="url(#busGlow)" />
</svg>
