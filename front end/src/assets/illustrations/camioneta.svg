<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" fill="none" role="img" aria-label="Ilustración Camioneta Cyber">
  <defs>
    <linearGradient id="suvBody" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#2a2a3e" />
      <stop offset="50%" stop-color="#181825" />
      <stop offset="100%" stop-color="#10101a" />
    </linearGradient>
    <linearGradient id="suvViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <linearGradient id="suvRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4057" />
      <stop offset="100%" stop-color="#FF7582" />
    </linearGradient>
    <filter id="suvGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ground Grid Line -->
  <line x1="20" y1="280" x2="580" y2="280" stroke="#222230" stroke-width="2" />
  <line x1="60" y1="280" x2="540" y2="280" stroke="#A855F7" stroke-width="2" opacity="0.4" filter="url(#suvGlow)" />

  <!-- Shadow & Underglow -->
  <ellipse cx="300" cy="275" rx="230" ry="12" fill="#A855F7" opacity="0.25" filter="url(#suvGlow)" />
  <ellipse cx="300" cy="275" rx="210" ry="8" fill="#000000" opacity="0.75" />

  <!-- Roof Rack & Aux Light Bars -->
  <line x1="160" y1="85" x2="380" y2="85" stroke="#38384f" stroke-width="4" stroke-linecap="round" />
  <line x1="200" y1="92" x2="200" y2="85" stroke="#38384f" stroke-width="3" />
  <line x1="340" y1="92" x2="340" y2="85" stroke="#38384f" stroke-width="3" />
  <line x1="385" y1="88" x2="415" y2="92" stroke="#FF4057" stroke-width="3" filter="url(#suvGlow)" />

  <!-- Main Body Shell (Robust SUV Contour) -->
  <path d="M 70 245 
           L 75 160 
           L 150 145 
           L 190 95 
           L 390 92 
           L 460 145 
           L 540 165 
           L 545 235 
           L 520 250 
           L 480 250 
           A 48 48 0 0 0 380 250 
           L 220 250 
           A 48 48 0 0 0 120 250 
           Z" 
        fill="url(#suvBody)" stroke="#38384f" stroke-width="2" />

  <!-- Windows (Tall Tinted Cabin) -->
  <path d="M 200 102 L 285 102 L 285 145 L 165 145 Z" fill="#12121c" stroke="#A855F7" stroke-width="1.5" />
  <path d="M 295 102 L 380 102 L 440 145 L 295 145 Z" fill="#12121c" stroke="#A855F7" stroke-width="1.5" />
  <path d="M 155 110 L 190 102 L 155 145 Z" fill="#09090F" stroke="#222230" stroke-width="1" />

  <!-- Cyber Neon Accents -->
  <path d="M 80 165 L 150 150 L 390 148 L 530 170" stroke="url(#suvViolet)" stroke-width="2.5" filter="url(#suvGlow)" />
  <line x1="75" y1="210" x2="535" y2="210" stroke="#FF4057" stroke-width="1.5" opacity="0.8" />
  <line x1="125" y1="250" x2="215" y2="250" stroke="#A855F7" stroke-width="3" />
  <line x1="385" y1="250" x2="475" y2="250" stroke="#A855F7" stroke-width="3" />

  <!-- Front Headlight & Cyber Grille -->
  <polygon points="530,172 546,182 538,205 520,195" fill="url(#suvViolet)" filter="url(#suvGlow)" />
  <line x1="546" y1="182" x2="575" y2="185" stroke="#C084FC" stroke-width="3" filter="url(#suvGlow)" />
  <line x1="510" y1="215" x2="540" y2="225" stroke="#FF4057" stroke-width="2.5" />

  <!-- Rear Cyber Light -->
  <rect x="70" y="165" width="10" height="40" rx="3" fill="url(#suvRed)" filter="url(#suvGlow)" />
  <line x1="50" y1="185" x2="70" y2="185" stroke="#FF4057" stroke-width="3" filter="url(#suvGlow)" />

  <!-- Rear Wheel (Aggressive Offroad / Cyber Hub) -->
  <circle cx="170" cy="250" r="44" fill="#09090F" stroke="#222230" stroke-width="5" />
  <circle cx="170" cy="250" r="28" fill="#161621" stroke="#A855F7" stroke-width="2.5" />
  <circle cx="170" cy="250" r="12" fill="#FF4057" filter="url(#suvGlow)" />
  <line x1="170" y1="224" x2="170" y2="276" stroke="#A855F7" stroke-width="2" />
  <line x1="144" y1="250" x2="196" y2="250" stroke="#A855F7" stroke-width="2" />

  <!-- Front Wheel -->
  <circle cx="430" cy="250" r="44" fill="#09090F" stroke="#222230" stroke-width="5" />
  <circle cx="430" cy="250" r="28" fill="#161621" stroke="#A855F7" stroke-width="2.5" />
  <circle cx="430" cy="250" r="12" fill="#FF4057" filter="url(#suvGlow)" />
  <line x1="430" y1="224" x2="430" y2="276" stroke="#A855F7" stroke-width="2" />
  <line x1="404" y1="250" x2="456" y2="250" stroke="#A855F7" stroke-width="2" />

  <!-- Door Outline & Side Step -->
  <line x1="220" y1="262" x2="380" y2="262" stroke="#4a4a62" stroke-width="4" stroke-linecap="round" />
  <line x1="290" y1="145" x2="290" y2="245" stroke="#161621" stroke-width="2" />
  <line x1="255" y1="165" x2="275" y2="165" stroke="#FF4057" stroke-width="2.5" stroke-linecap="round" />
  <line x1="330" y1="165" x2="350" y2="165" stroke="#FF4057" stroke-width="2.5" stroke-linecap="round" />
</svg>
