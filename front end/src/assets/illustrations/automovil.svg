<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" fill="none" role="img" aria-label="Ilustración Automóvil Cyber">
  <defs>
    <linearGradient id="carBody" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#2a2a3c" />
      <stop offset="50%" stop-color="#1a1a27" />
      <stop offset="100%" stop-color="#12121c" />
    </linearGradient>
    <linearGradient id="neonViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <linearGradient id="neonRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4057" />
      <stop offset="100%" stop-color="#FF7582" />
    </linearGradient>
    <linearGradient id="windowTint" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b3b52" />
      <stop offset="100%" stop-color="#101018" />
    </linearGradient>
    <filter id="carGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ground Cyber Grid Line -->
  <line x1="30" y1="260" x2="570" y2="260" stroke="#222230" stroke-width="2" />
  <line x1="80" y1="260" x2="520" y2="260" stroke="#A855F7" stroke-width="2" opacity="0.4" filter="url(#carGlow)" />

  <!-- Shadow & Underglow -->
  <ellipse cx="300" cy="256" rx="220" ry="12" fill="#A855F7" opacity="0.25" filter="url(#carGlow)" />
  <ellipse cx="300" cy="256" rx="200" ry="8" fill="#000000" opacity="0.7" />

  <!-- Main Chassis / Body Shell -->
  <path d="M 80 230 
           L 95 190 
           L 150 170 
           L 220 120 
           L 360 115 
           L 460 160 
           L 530 185 
           L 540 215 
           L 530 235 
           L 475 235 
           A 45 45 0 0 0 385 235 
           L 215 235 
           A 45 45 0 0 0 125 235 
           Z" 
        fill="url(#carBody)" stroke="#38384f" stroke-width="2" />

  <!-- Cyber Neon Accents & Character Lines -->
  <path d="M 150 175 L 222 125 L 358 120 L 455 163" stroke="url(#neonViolet)" stroke-width="3" filter="url(#carGlow)" />
  <path d="M 98 192 L 180 190 L 320 185 L 530 195" stroke="#A855F7" stroke-width="1.5" opacity="0.8" />
  <path d="M 130 235 L 210 235" stroke="url(#neonRed)" stroke-width="2" />
  <path d="M 390 235 L 470 235" stroke="url(#neonRed)" stroke-width="2" />

  <!-- Aerodynamic Roof & Cabin Windows -->
  <path d="M 225 125 
           L 355 122 
           L 440 160 
           L 310 160 
           Z" 
        fill="url(#windowTint)" stroke="#A855F7" stroke-width="1.5" />
  <path d="M 215 130 
           L 295 160 
           L 170 165 
           Z" 
        fill="url(#windowTint)" stroke="#38384f" stroke-width="1" />
  <line x1="305" y1="123" x2="305" y2="160" stroke="#161621" stroke-width="3" />

  <!-- Headlight (Front Cyber Beam) -->
  <polygon points="528,198 545,212 530,218 518,206" fill="url(#neonViolet)" filter="url(#carGlow)" />
  <line x1="545" y1="212" x2="575" y2="216" stroke="#C084FC" stroke-width="2" filter="url(#carGlow)" />

  <!-- Taillight (Rear Cyber Strip) -->
  <path d="M 80 205 L 96 195 L 92 215 Z" fill="url(#neonRed)" filter="url(#carGlow)" />
  <line x1="60" y1="205" x2="80" y2="205" stroke="#FF4057" stroke-width="3" filter="url(#carGlow)" />

  <!-- Rear Wheel Assembly -->
  <circle cx="170" cy="235" r="40" fill="#09090F" stroke="#222230" stroke-width="4" />
  <circle cx="170" cy="235" r="26" fill="#161621" stroke="url(#neonViolet)" stroke-width="2" />
  <circle cx="170" cy="235" r="10" fill="#A855F7" filter="url(#carGlow)" />
  <!-- Rims / Spokes -->
  <line x1="170" y1="211" x2="170" y2="259" stroke="#A855F7" stroke-width="2" />
  <line x1="146" y1="235" x2="194" y2="235" stroke="#A855F7" stroke-width="2" />
  <line x1="153" y1="218" x2="187" y2="252" stroke="#FF4057" stroke-width="1.5" />

  <!-- Front Wheel Assembly -->
  <circle cx="430" cy="235" r="40" fill="#09090F" stroke="#222230" stroke-width="4" />
  <circle cx="430" cy="235" r="26" fill="#161621" stroke="url(#neonViolet)" stroke-width="2" />
  <circle cx="430" cy="235" r="10" fill="#A855F7" filter="url(#carGlow)" />
  <!-- Rims / Spokes -->
  <line x1="430" y1="211" x2="430" y2="259" stroke="#A855F7" stroke-width="2" />
  <line x1="406" y1="235" x2="454" y2="235" stroke="#A855F7" stroke-width="2" />
  <line x1="413" y1="218" x2="447" y2="252" stroke="#FF4057" stroke-width="1.5" />

  <!-- Door Handle & Panel Gap -->
  <line x1="280" y1="175" x2="305" y2="175" stroke="#FF4057" stroke-width="2" stroke-linecap="round" />
  <path d="M 330 160 L 325 232" stroke="#161621" stroke-width="1.5" />
</svg>
