<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" role="img" aria-label="Logo Autos Colombia Cyber">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#FF4057" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Hexagon -->
  <polygon points="50,4 92,26 92,74 50,96 8,74 8,26" stroke="#222230" stroke-width="3" fill="#161621" />
  <polygon points="50,10 86,30 86,70 50,90 14,70 14,30" stroke="url(#cyberGrad)" stroke-width="2.5" fill="#09090F" filter="url(#neonGlow)" />
  
  <!-- Stylized Monogram AC & Automotive Chevron -->
  <path d="M50 22 L72 68 H58 L50 50 L42 68 H28 Z" fill="url(#cyberGrad)" />
  <path d="M50 36 L60 58 H40 Z" fill="#09090F" />
  <path d="M35 72 L50 82 L65 72" stroke="#FF4057" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="50" cy="50" r="3" fill="#A855F7" />
</svg>
