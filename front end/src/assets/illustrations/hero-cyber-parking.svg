<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" fill="none" role="img" aria-label="Escena Panorámica Parqueadero Cyber Colombia">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050508" />
      <stop offset="70%" stop-color="#0e0e17" />
      <stop offset="100%" stop-color="#161622" />
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="neonG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#FF4057" />
    </linearGradient>
    <filter id="heroGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Sky / Cyber Dome -->
  <rect width="900" height="420" fill="url(#skyGrad)" />

  <!-- Background City Skyline (Geometric Neon Silhouettes) -->
  <polygon points="40,240 40,160 80,140 110,180 140,110 170,110 200,240" fill="#12121d" stroke="#222230" stroke-width="1" />
  <polygon points="210,240 230,90 270,90 300,150 320,130 350,240" fill="#10101a" stroke="#222230" stroke-width="1" />
  <polygon points="650,240 680,120 720,120 740,170 780,100 820,150 860,240" fill="#11111b" stroke="#222230" stroke-width="1" />
  <!-- Neon Antennas & Towers -->
  <line x1="155" y1="110" x2="155" y2="70" stroke="#FF4057" stroke-width="2" />
  <circle cx="155" cy="68" r="3" fill="#FF4057" filter="url(#heroGlow)" />
  <line x1="250" y1="90" x2="250" y2="50" stroke="#A855F7" stroke-width="2" />
  <circle cx="250" cy="48" r="3" fill="#A855F7" filter="url(#heroGlow)" />

  <!-- Perspective Floor (Cyber Grid) -->
  <polygon points="0,250 900,250 900,420 0,420" fill="#0d0d15" />
  
  <!-- Perspective Grid Lines -->
  <line x1="0" y1="250" x2="900" y2="250" stroke="#222230" stroke-width="2" />
  <line x1="0" y1="280" x2="900" y2="280" stroke="#2a2a3e" stroke-width="1.5" />
  <line x1="0" y1="320" x2="900" y2="320" stroke="#383852" stroke-width="1.5" />
  <line x1="0" y1="370" x2="900" y2="370" stroke="#A855F7" stroke-width="2" opacity="0.4" filter="url(#heroGlow)" />

  <line x1="450" y1="250" x2="450" y2="420" stroke="#FF4057" stroke-width="2" opacity="0.6" />
  <line x1="450" y1="250" x2="250" y2="420" stroke="#A855F7" stroke-width="1.5" opacity="0.5" />
  <line x1="450" y1="250" x2="50" y2="420" stroke="#A855F7" stroke-width="1.5" opacity="0.5" />
  <line x1="450" y1="250" x2="650" y2="420" stroke="#A855F7" stroke-width="1.5" opacity="0.5" />
  <line x1="450" y1="250" x2="850" y2="420" stroke="#A855F7" stroke-width="1.5" opacity="0.5" />

  <!-- Parking Bays (Celdas Holográficas) -->
  <!-- Bay A-01 (Left) -->
  <polygon points="70,300 210,300 230,380 50,380" fill="#161624" stroke="#A855F7" stroke-width="2" opacity="0.8" />
  <text x="105" y="345" fill="#A855F7" font-family="monospace" font-size="14" font-weight="bold">CELDA A-01</text>
  <text x="110" y="365" fill="#10B981" font-family="monospace" font-size="11" font-weight="bold">[ LIBRE ]</text>

  <!-- Bay B-02 (Right) -->
  <polygon points="690,300 830,300 850,380 670,380" fill="#201524" stroke="#FF4057" stroke-width="2" opacity="0.8" />
  <text x="725" y="345" fill="#FF4057" font-family="monospace" font-size="14" font-weight="bold">CELDA B-02</text>
  <text x="722" y="365" fill="#FF7582" font-family="monospace" font-size="11" font-weight="bold">[ OCUPADA ]</text>

  <!-- Center Vehicle (Sleek Cyber Car in Entry Bay) -->
  <g transform="translate(300, 200) scale(0.6)">
    <!-- Car silhouette on entrance -->
    <path d="M 50 180 L 70 140 L 130 120 L 200 80 L 320 75 L 410 115 L 460 135 L 470 165 L 450 180 Z" fill="#1a1a28" stroke="#A855F7" stroke-width="3" filter="url(#heroGlow)" />
    <path d="M 195 85 L 315 80 L 390 115 L 280 115 Z" fill="#09090F" stroke="#FF4057" stroke-width="2" />
    <circle cx="120" cy="180" r="30" fill="#09090F" stroke="#A855F7" stroke-width="3" />
    <circle cx="390" cy="180" r="30" fill="#09090F" stroke="#A855F7" stroke-width="3" />
    <!-- Light Beam -->
    <polygon points="460,150 560,170 550,200 450,170" fill="url(#neonG)" opacity="0.3" filter="url(#heroGlow)" />
  </g>

  <!-- Cyber Entrance Arch / Gateway -->
  <path d="M 280 250 L 280 120 L 620 120 L 620 250" stroke="#3b3b55" stroke-width="8" stroke-linecap="square" />
  <path d="M 285 125 L 615 125" stroke="url(#neonG)" stroke-width="3" filter="url(#heroGlow)" />
  <rect x="360" y="95" width="180" height="30" rx="4" fill="#09090F" stroke="#A855F7" stroke-width="2" />
  <text x="382" y="115" fill="#F4F4F5" font-family="sans-serif" font-size="12" font-weight="bold" letter-spacing="2">AUTOS COLOMBIA</text>
  <circle cx="372" cy="110" r="4" fill="#10B981" filter="url(#heroGlow)" />

  <!-- Floating HUD Interface Box (Left) -->
  <rect x="40" y="40" width="180" height="85" rx="6" fill="#161621" fill-opacity="0.85" stroke="#A855F7" stroke-width="1.5" />
  <line x1="40" y1="65" x2="220" y2="65" stroke="#222230" stroke-width="1" />
  <text x="52" y="57" fill="#C084FC" font-family="monospace" font-size="11" font-weight="bold">ESTADO SISTEMA</text>
  <circle cx="205" cy="54" r="4" fill="#10B981" filter="url(#heroGlow)" />
  <text x="52" y="82" fill="#B8B8C8" font-family="sans-serif" font-size="10">CELDAS TOTALES: 10</text>
  <text x="52" y="98" fill="#B8B8C8" font-family="sans-serif" font-size="10">OCUPACIÓN: EN TIEMPO REAL</text>
  <text x="52" y="114" fill="#FF7582" font-family="sans-serif" font-size="10">CONTROL MENSUALIDADES</text>

  <!-- Floating HUD Interface Box (Right) -->
  <rect x="680" y="40" width="180" height="85" rx="6" fill="#161621" fill-opacity="0.85" stroke="#FF4057" stroke-width="1.5" />
  <line x1="680" y1="65" x2="860" y2="65" stroke="#222230" stroke-width="1" />
  <text x="692" y="57" fill="#FF7582" font-family="monospace" font-size="11" font-weight="bold">GESTIÓN DE PAGOS</text>
  <text x="692" y="82" fill="#B8B8C8" font-family="sans-serif" font-size="10">RECAUDO MENSUAL: ACTIVO</text>
  <text x="692" y="98" fill="#B8B8C8" font-family="sans-serif" font-size="10">IDEMPOTENCIA GARANTIZADA</text>
  <text x="692" y="114" fill="#C084FC" font-family="sans-serif" font-size="10">COMPROBANTES INTERNOS</text>
</svg>
